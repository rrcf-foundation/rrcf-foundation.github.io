<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCSP-1 Reference Controller — RRCF</title>
<meta name="description" content="Live in-browser demo of the RRCF controller-side reference implementation: a single React UI covering all 9 base robot morphology categories.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<style>
  html,body{margin:0;background:#060a0f;}
  #topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 18px;background:#0a0e13;border-bottom:1px solid #1a2530;
    font-family:'Share Tech Mono','SFMono-Regular',Consolas,monospace;
    font-size:11.5px;color:#7b8794;
  }
  #topbar a{color:#5fc9c0;text-decoration:none;}
  #topbar a:hover{text-decoration:underline;}
  #loading{color:#5fc9c0;text-align:center;padding:60px;font-family:monospace;font-size:13px;}
  #root{min-height:calc(100vh - 41px);}
</style>
</head>
<body>

<div id="topbar">
  <span>← <a href="../index.html">RRCF</a> · Controller reference implementation (live demo)</span>
  <span><a href="https://github.com/rrcf-foundation/RRCF/blob/main/reference-implementation/RCSP1_UniversalRobotControl.jsx" target="_blank" rel="noopener">View source on GitHub</a></span>
</div>
<div id="loading">Loading reference controller…</div>
<div id="root"></div>

<!-- This page runs the actual reference-implementation JSX file, unmodified
     except for the React import line (CDN UMD build exposes React as a
     global rather than an ES module — see RCSP1_UniversalRobotControl.jsx
     line 1 for the one-line diff). Compiled client-side with Babel standalone
     so no build step is needed to demo it here. For production use, run it
     through your own toolchain (Vite/CRA/Next) as you would any React
     component. -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
  // Fetch + transform manually (rather than the automatic script[type=text/babel]
  // pipeline) so we can force the "classic" JSX runtime — babel-standalone's
  // default "automatic" runtime expects an import-map-resolvable
  // "react/jsx-runtime" module, which isn't available in a plain <script>
  // page with no bundler.
  fetch('./RCSP1_UniversalRobotControl.jsx')
    .then(r => r.text())
    .then(source => {
      const { code } = Babel.transform(source, {
        presets: [['react', { runtime: 'classic' }]],
        filename: 'RCSP1_UniversalRobotControl.jsx',
      });
      // eslint-disable-next-line no-eval
      (0, eval)(code);
      const root = ReactDOM.createRoot(document.getElementById('root'));
      document.getElementById('loading').style.display = 'none';
      root.render(React.createElement(RCSP1Controller));
    })
    .catch(err => {
      document.getElementById('loading').textContent =
        'Failed to load component: ' + err.message;
      console.error(err);
    });
</script>

</body>
</html>
