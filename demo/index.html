<style>

  html[data-theme='dark']{--shell-bg:#0d1117;--shell-panel:#11161d;--shell-line:#29333e;--shell-text:#e1e7ed;--shell-dim:#9aa6b3;--shell-accent:#64d2c8;}
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--shell-bg);color:var(--shell-text);}
  #topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 18px;background:var(--shell-panel);border-bottom:1px solid var(--shell-line);font-family:'Share Tech Mono','SFMono-Regular',Consolas,monospace;font-size:11.5px;color:var(--shell-dim);}
  .topbar-side{display:flex;align-items:center;gap:14px;min-width:0;}
  .brand{display:inline-flex;align-items:center;gap:8px;color:var(--shell-text);font-weight:700;text-decoration:none;white-space:nowrap;}
  .brand:hover,#topbar a:hover{color:var(--shell-accent);}
  #topbar a{color:var(--shell-accent);text-decoration:none;}
  .theme-toggle{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;color:var(--shell-text);background:var(--shell-bg);border:1px solid var(--shell-line);border-radius:999px;font:600 11px/1 inherit;cursor:pointer;}
  #loading{color:var(--shell-accent);text-align:center;padding:60px;font-family:monospace;font-size:13px;}
  #root{min-height:calc(100vh - 43px);}
  @media(max-width:700px){.topbar-context{display:none;}#topbar{padding:9px 12px;}.theme-toggle [data-theme-label]{display:none;}}
</style>

<script>
  fetch('./RCSP1_UniversalRobotControl.jsx')
    .then(r => r.text())
    .then(source => {
      const { code } = Babel.transform(source, { presets: [['react', { runtime: 'classic' }]], filename: 'RCSP1_UniversalRobotControl.jsx' });
      (0, eval)(code);
      const root = ReactDOM.createRoot(document.getElementById('root'));
      document.getElementById('loading').style.display = 'none';
      root.render(React.createElement(RCSP1Controller));
    })
    .catch(err => {
      document.getElementById('loading').textContent = 'Failed to load component: ' + err.message;
      console.error(err);
    });
</script>
